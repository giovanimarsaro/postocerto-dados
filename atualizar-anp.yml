name: Atualizar dados da ANP

on:
  schedule:
    # toda sexta-feira às 15h UTC (12h em Brasília) - depois que a ANP costuma publicar
    - cron: "0 15 * * 5"
  workflow_dispatch: {}   # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests openpyxl

      - name: Rodar o robô
        run: python atualizar_anp.py

      - name: Salvar o resultado no repositório
        run: |
          git config user.name "postocerto-bot"
          git config user.email "bot@postocerto.local"
          git add anp-referencia.json
          git diff --quiet --cached || git commit -m "Atualização automática dos preços ANP"
          git push
